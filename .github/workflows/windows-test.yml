name: Windows CI Test

on:
  workflow_dispatch:

jobs:
  build-windows-x64-debug:
    runs-on: windows-2022

    steps:
      - name: Checkout GitLab main
        shell: pwsh
        run: |
          git clone --depth 1 --branch main https://gitlab.com/AuroraXEMY/cpp-project-template.git .

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          git config --global core.autocrlf false
          git config --global advice.detachedHead false

          $vcpkgRef = "master"

          if (Test-Path "vcpkg.json") {
            $manifest = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json
            if ($manifest.'builtin-baseline') {
              $vcpkgRef = $manifest.'builtin-baseline'
            }
          }

          git init vcpkg
          cd vcpkg
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch --depth 1 --no-tags origin "$vcpkgRef"
          git checkout FETCH_HEAD
          cd ..

          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Verify custom triplet
        shell: pwsh
        run: |
          $triplet = ".gitlab\vcpkg-triplets\x64-windows-debug.cmake"

          if (!(Test-Path $triplet)) {
            Write-Error "Missing custom triplet: $triplet"
          }

          Get-Content $triplet

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "vcpkg_cache" | Out-Null

          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:GITHUB_WORKSPACE\vcpkg_cache,readwrite"
          $env:VCPKG_MANIFEST_MODE = "ON"

          .\vcpkg\vcpkg install `
            --triplet x64-windows-debug `
            --overlay-triplets="$env:GITHUB_WORKSPACE\.gitlab\vcpkg-triplets"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -D CMAKE_BUILD_TYPE=Debug `
            -D VCPKG_TARGET_TRIPLET=x64-windows-debug `
            -D VCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\.gitlab\vcpkg-triplets" `
            -D VCPKG_MANIFEST_MODE=ON `
            -D CMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug -- /m

      - name: Test Debug
        shell: pwsh
        run: |
          cd build
          ctest -C Debug --output-on-failure
