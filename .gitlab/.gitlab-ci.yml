# .gitlab/.gitlab-ci.yml
#
# Notes:
# - This keeps your current working architecture and applies safe, modern fixes.
# - Windows jobs use manifest-aware vcpkg fetching + binary caching to reduce timeout risk.
# - build:windows now installs with single-config overlay triplets from
#   .gitlab/vcpkg-triplets/ (e.g. x64-windows-debug) instead of the stock
#   x64-windows/x86-windows triplets, so vcpkg builds only the Debug OR Release
#   config of wxWidgets/gtest per leg, not both. A cold-cache from-source
#   wxWidgets build was the main thing blowing past the job timeout.
# - vcpkg.json now lists gtest alongside wxwidgets: src/projectlib/test/CMakeLists.txt
#   does a hard find_package(GTest REQUIRED), which nothing on Windows previously
#   provided (GitHub's ci.yml already installs gtest via vcpkg for its Windows legs;
#   this brings GitLab's manifest in line with that).
# - Project Settings > CI/CD > General pipelines > Timeout is still separate from this
#   file and still needs raising above the 60-minute default by hand (GitLab account
#   setting, not expressible in YAML) -- see the state-sync notes, Blocker 3.
# - vcpkg.json still has no "builtin-baseline" pin (Blocker 1) -- floats on vcpkg's
#   "master" branch via $VCPKG_GIT_REF below. Not fixed in this pass; get a real SHA
#   via `git ls-remote https://github.com/microsoft/vcpkg master` when you want to pin it.

stages:
  - docker_images
  - static_analysis
  - build
  - documentation
  - deploy
  - maintenance

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "20"
  DEBIAN_FRONTEND: noninteractive
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_GIT_REF: "master"
  BUILD_GCC_DEB_IMAGE: "$CI_REGISTRY_IMAGE/build_gcc_deb:latest"
  DOXYGEN_IMAGE: "$CI_REGISTRY_IMAGE/doxygen:latest"
  DOCKER_SCRIPTS_PATH: ".gitlab/docker_scripts"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true

# ============================================================================
# Docker image builder
# ============================================================================
.image:
  stage: docker_images
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo -n "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - TARGET="$(printf '%s\n' "$CI_JOB_NAME" | cut -f 2 -d '/')"
    - cd "$DOCKER_SCRIPTS_PATH/$TARGET"
    - docker build --pull -t "$CI_REGISTRY_IMAGE/$TARGET:latest" .
    - docker push "$CI_REGISTRY_IMAGE/$TARGET:latest"
  after_script:
    - docker logout "$CI_REGISTRY" || true
  resource_group: "$CI_JOB_NAME"

image/doxygen:
  extends: .image
  rules:
    - changes:
        - .gitlab/docker_scripts/doxygen/**/*

image/build_gcc_deb:
  extends: .image
  rules:
    - changes:
        - .gitlab/docker_scripts/build_gcc_deb/**/*

# ============================================================================
# Static analysis
# ============================================================================
clang-tidy:
  stage: static_analysis
  image: "$BUILD_GCC_DEB_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apt-get update
    - apt-get install -y clang-tidy
    - bash scripts/run_clang_tidy.sh

coverity:
  stage: static_analysis
  image: "$BUILD_GCC_DEB_IMAGE"
  rules:
    - when: manual
      allow_failure: true
  script:
    - echo "Starting manual Coverity scan placeholder."
    - |
      if [ -z "$COVERITY_SCAN_EMAIL" ] || [ -z "$COVERITY_SCAN_TOKEN" ]; then
        echo "COVERITY_SCAN_EMAIL and COVERITY_SCAN_TOKEN must be configured before running Coverity."
        exit 1
      fi
    - echo "Add the official Coverity Download/scan steps here. This job is manual and does not block the pipeline."

# ============================================================================
# Build templates
# ============================================================================
.build_template:
  stage: build
  interruptible: true
  artifacts:
    when: always
    paths:
      - build/
    expire_in: 1 week

# ============================================================================
# Linux core job
# ============================================================================
build:linux:gcc:debug:
  extends: .build_template
  image: "$BUILD_GCC_DEB_IMAGE"
  variables:
    CC: gcc
    CXX: g++
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    CCACHE_BASEDIR: "$CI_PROJECT_DIR"
  rules:
    - when: always
  cache:
    key: "$CI_JOB_NAME_SLUG-ccache"
    paths:
      - .ccache/
    policy: pull-push
  script:
    - set -euo pipefail
    - apt-get update
    - apt-get install -y ccache lcov ninja-build
    - export PATH="/usr/lib/ccache:$PATH"
    - ccache --show-stats || true
    - cmake -S . -B build
      -G Ninja
      -D CMAKE_MAKE_PROGRAM=ninja
      -D CMAKE_BUILD_TYPE=Debug
      -D CMAKE_C_COMPILER_LAUNCHER=ccache
      -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
      -D CMAKE_C_FLAGS="--coverage"
      -D CMAKE_CXX_FLAGS="--coverage"
      -D CMAKE_EXE_LINKER_FLAGS="--coverage"
    - cmake --build build
    - cd build && ctest --output-on-failure -C Debug && cd ..
    - bash scripts/generate_coverage.sh
    - ccache --show-stats || true
  artifacts:
    when: always
    paths:
      - build/
      - coverage/
    expire_in: 1 week
  coverage: '/lines.*:\s*\d+\.\d+%/'

# ============================================================================
# Linux matrix
# ============================================================================
build:linux:matrix:
  extends: .build_template
  image: "$BUILD_GCC_DEB_IMAGE"
  variables:
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    CCACHE_BASEDIR: "$CI_PROJECT_DIR"
  parallel:
    matrix:
      - COMPILER: [gcc, clang]
        BUILD_TYPE: [Debug, Release]
  rules:
    - if: '$COMPILER == "gcc" && $BUILD_TYPE == "Debug"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $COMPILER == "clang" && $BUILD_TYPE == "Release"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  cache:
    key: "$CI_JOB_NAME_SLUG-$COMPILER-$BUILD_TYPE-ccache"
    paths:
      - .ccache/
    policy: pull-push
  script:
    - set -euo pipefail
    - apt-get update
    - apt-get install -y ccache clang ninja-build
    - export PATH="/usr/lib/ccache:$PATH"
    - if [ "$COMPILER" = "clang" ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
    - ccache --show-stats || true
    - cmake -S . -B build
      -G Ninja
      -D CMAKE_MAKE_PROGRAM=ninja
      -D CMAKE_BUILD_TYPE=$BUILD_TYPE
      -D CMAKE_C_COMPILER_LAUNCHER=ccache
      -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
    - cmake --build build
    - cd build && ctest -C $BUILD_TYPE --output-on-failure && cd ..
    - ccache --show-stats || true

# ============================================================================
# Windows matrix
# ============================================================================
build:windows:
  extends: .build_template
  tags:
    - saas-windows-medium-amd64
  variables:
    CMAKE_GENERATOR: "Visual Studio 17 2022"
  parallel:
    matrix:
      - ARCH: "x64"
        CMAKE_ARCH: "x64"
        VCPKG_TARGET_TRIPLET: "x64-windows"
        BUILD_TYPE: ["Debug", "Release"]
      - ARCH: "i686"
        CMAKE_ARCH: "Win32"
        VCPKG_TARGET_TRIPLET: "x86-windows"
        BUILD_TYPE: ["Debug", "Release"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ARCH == "x64" && $BUILD_TYPE == "Debug"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  cache:
    - key:
        files:
          - vcpkg.json
        prefix: "windows-$VCPKG_GIT_REF-$ARCH-$BUILD_TYPE"
      paths:
        - vcpkg_cache/
      policy: pull-push
  artifacts:
    when: always
    paths:
      - build/
    expire_in: 1 week
  script:
    - |
      $ErrorActionPreference = "Stop"
      $ProgressPreference = "SilentlyContinue"

      git config --global core.autocrlf false
      git config --global advice.detachedHead false

      New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\vcpkg_cache" | Out-Null
      $env:VCPKG_BINARY_SOURCES = "clear;files,$env:CI_PROJECT_DIR\vcpkg_cache,readwrite"
      $env:VCPKG_MANIFEST_MODE = "ON"

      $buildTypeLower = $env:BUILD_TYPE.ToLower()
      $fullTriplet = "$env:VCPKG_TARGET_TRIPLET-$buildTypeLower"
      $overlayTripletsDir = "$env:CI_PROJECT_DIR\.gitlab\vcpkg-triplets"

      $vcpkgRef = $env:VCPKG_GIT_REF
      if (Test-Path "$env:CI_PROJECT_DIR\vcpkg.json") {
        $manifest = Get-Content "$env:CI_PROJECT_DIR\vcpkg.json" -Raw | ConvertFrom-Json
        if ($manifest.'builtin-baseline') {
          $vcpkgRef = $manifest.'builtin-baseline'
        }
      }

      if (Test-Path "$env:CI_PROJECT_DIR\vcpkg") {
        Remove-Item -Recurse -Force "$env:CI_PROJECT_DIR\vcpkg"
      }

      git init vcpkg
      cd vcpkg
      git remote add origin https://github.com/microsoft/vcpkg.git
      git fetch --depth 1 --no-tags origin "$vcpkgRef"

      if ($LASTEXITCODE -eq 0) {
        git checkout FETCH_HEAD
      } else {
        cd $env:CI_PROJECT_DIR
        Remove-Item -Recurse -Force vcpkg
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        cd vcpkg
        git checkout "$vcpkgRef"
      }

      cd $env:CI_PROJECT_DIR
    - .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
    - .\vcpkg\vcpkg install --triplet $fullTriplet --overlay-triplets="$overlayTripletsDir"
    - $env:VCPKG_TOOLCHAIN_FILE = "$env:CI_PROJECT_DIR\vcpkg\scripts\buildsystems\vcpkg.cmake" -replace '\\','/'
    - cmake -S . -B build
      -G "$env:CMAKE_GENERATOR"
      -A $env:CMAKE_ARCH
      -D CMAKE_BUILD_TYPE=$env:BUILD_TYPE
      -D VCPKG_TARGET_TRIPLET=$fullTriplet
      -D VCPKG_OVERLAY_TRIPLETS="$overlayTripletsDir"
      -D VCPKG_MANIFEST_MODE=ON
      -D CMAKE_TOOLCHAIN_FILE="$env:VCPKG_TOOLCHAIN_FILE"
    - cmake --build build --config $env:BUILD_TYPE -- /m
    - cd build
    - ctest -C $env:BUILD_TYPE --output-on-failure

# ============================================================================
# macOS manual matrix
# ============================================================================
build:macos:
  extends: .build_template
  tags:
    - saas-macos-medium-m1
  parallel:
    matrix:
      - BUILD_TYPE: ["Debug", "Release"]
  rules:
    - when: manual
      allow_failure: true
  script:
    - set -euo pipefail
    - brew update || true
    - brew install cmake ninja wxwidgets googletest || true
    - cmake -S . -B build
      -G Ninja
      -D CMAKE_MAKE_PROGRAM=ninja
      -D CMAKE_BUILD_TYPE=$BUILD_TYPE
    - cmake --build build --config $BUILD_TYPE
    - cd build && ctest -C $BUILD_TYPE --output-on-failure

# ============================================================================
# Doxygen documentation
# ============================================================================
doxygen_html:
  stage: documentation
  image: "$DOXYGEN_IMAGE"
  dependencies: []
  needs:
    - job: image/doxygen
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - set -euo pipefail
    - rm -rf build-doxygen
    - cmake -S . -B build-doxygen
      -G "Unix Makefiles"
      -D BUILD_SOURCE=OFF
      -D DOXYGEN_GENERATE_HTML=YES
      -D DOXYGEN_GENERATE_LATEX=NO
    - cmake --build build-doxygen --target doxygen
    - test -f docs/doxygen/build/html/index.html
    - rm -rf doxygen-html && mkdir -p doxygen-html
    - cp -a docs/doxygen/build/html/. doxygen-html/
    - test -f doxygen-html/index.html
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - doxygen-html/

# ============================================================================
# GitLab Pages
# ============================================================================
pages:
  stage: deploy
  image: busybox:latest
  interruptible: false
  needs:
    - job: doxygen_html
      artifacts: true
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - set -euo pipefail
    - test -f doxygen-html/index.html
    - rm -rf public && mkdir -p public
    - cp -a doxygen-html/. public/
    - test -f public/index.html
  artifacts:
    when: on_success
    paths:
      - public/
  resource_group: pages

# ============================================================================
# Maintenance
# ============================================================================
clear_cache:
  stage: maintenance
  image: curlimages/curl:latest
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - echo "Clearing GitLab caches for project $CI_PROJECT_ID..."
    - 'curl --request DELETE --header "PRIVATE-TOKEN: ${CACHE_CLEAR_TOKEN}" "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/cache"'
    - echo "Cache cleared. Ensure CACHE_CLEAR_TOKEN is a masked project/group CI variable with api scope."